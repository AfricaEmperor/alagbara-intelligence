name: SCOUT Tracking Intelligence tests

on:
  push:
    branches:
      - feat/scout-tracking-intelligence-v0.1
  pull_request:
    paths:
      - "scout-intelligence-fabric/**"
      - ".github/workflows/scout-tracking-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scout-intelligence-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check src/scout_fabric/tracking.py src/scout_fabric/track_cli.py tests/test_tracking.py
