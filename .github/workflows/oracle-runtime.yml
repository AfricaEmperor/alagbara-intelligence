name: ORACLE runtime tests
on:
  pull_request:
    paths:
      - 'contracts/oracle/**'
      - 'oracle_runtime/**'
      - '.github/workflows/oracle-runtime.yml'
  push:
    branches: [main, feat/oracle-decision-contract-v0.1]
    paths:
      - 'contracts/oracle/**'
      - 'oracle_runtime/**'
      - '.github/workflows/oracle-runtime.yml'
permissions:
  contents: read
jobs:
  oracle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: oracle_runtime/pyproject.toml
      - name: Install package
        run: python -m pip install -e './oracle_runtime[dev]'
      - name: Validate contract and runtime
        run: PYTHONPATH=oracle_runtime pytest -q oracle_runtime/tests
