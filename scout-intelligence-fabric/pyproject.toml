[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-intelligence-fabric"
version = "0.1.0"
description = "Evidence-first acquisition layer for ALAGBARA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scout-acquire = "scout_fabric.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
